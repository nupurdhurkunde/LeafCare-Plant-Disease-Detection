<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeafCare | Plant Health Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">🌿 LeafCare<small data-i18n="brandSub"></small></div>
    <nav>
      <button class="active" data-page="dashboard">▦ <span data-i18n="dashboard"></span></button>
      <button data-page="analyze">📷 <span data-i18n="analyze"></span></button>
      <button data-page="guide">📖 <span data-i18n="guide"></span></button>
      <button data-page="tips">🌱 <span data-i18n="tips"></span></button>
    </nav>
    <div class="sidebar-note">
      <strong data-i18n="sideTitle"></strong>
      <p data-i18n="sideText"></p>
      <p data-i18n="model"></p>
    </div>
  </aside>

  <div class="main">
    <header>
      <strong id="breadcrumb"></strong>
      <div>
        <button id="themeButton" data-i18n="theme"></button>
        <button id="languageButton" data-i18n="lang"></button>
      </div>
    </header>

    <main class="content">

      <!-- DASHBOARD -->
      <section class="page active" id="dashboard">
        <p class="green"><strong data-i18n="welcome"></strong></p>
        <h1 data-i18n="heading"></h1>
        <p class="muted" data-i18n="intro"></p>

        <div class="panel">
          <h2 data-i18n="check"></h2>
          <p data-i18n="choose"></p>
          <button class="primary" id="startAnalyze" data-i18n="start"></button>
        </div>

        <div class="grid">
          <div class="stat"><strong>7</strong><span data-i18n="st1"></span></div>
          <div class="stat"><strong>2</strong><span data-i18n="st2"></span></div>
          <div class="stat"><strong id="scanCount">0</strong><span data-i18n="st3"></span></div>
        </div>

        <div class="panel fancy">
          <div class="head">
            <div>
              <span class="tag" data-i18n="tag1"></span>
              <h2 data-i18n="how"></h2>
              <p data-i18n="howSub"></p>
            </div>
            <div class="leaf-icon">🍃</div>
          </div>
          <div class="steps">
            <div class="work-step">
              <div class="step-icon">📸</div>
              <span class="step-number"><span data-i18n="step"></span> 01</span>
              <h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p>
            </div>
            <span class="arrow">→</span>
            <div class="work-step">
              <div class="step-icon">🤖</div>
              <span class="step-number"><span data-i18n="step"></span> 02</span>
              <h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p>
            </div>
            <span class="arrow">→</span>
            <div class="work-step">
              <div class="step-icon">🔍</div>
              <span class="step-number"><span data-i18n="step"></span> 03</span>
              <h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p>
            </div>
            <span class="arrow">→</span>
            <div class="work-step">
              <div class="step-icon">🌱</div>
              <span class="step-number"><span data-i18n="step"></span> 04</span>
              <h3 data-i18n="s4t"></h3><p data-i18n="s4d"></p>
            </div>
          </div>
        </div>

        <div class="panel fancy">
          <div class="head">
            <div>
              <span class="tag" data-i18n="tag2"></span>
              <h2 data-i18n="recent"></h2>
              <p data-i18n="recentSub"></p>
            </div>
          </div>
          <div class="activity-summary">
            <div><strong id="activityCount">0</strong><span data-i18n="total"></span></div>
          </div>
          <ul id="history" class="activity-list"><li class="muted" data-i18n="noHistory"></li></ul>
          <button class="secondary activity-clear" id="clearHistory" data-i18n="clear"></button>
        </div>
      </section>

      <!-- ANALYZE -->
      <section class="page" id="analyze">
        <h1 data-i18n="aHead"></h1>
        <p class="muted" data-i18n="aIntro"></p>
        <div class="panel">
          <div class="upload">
            <h2 data-i18n="upload"></h2>
            <p data-i18n="uploadHelp"></p>
            <input type="file" id="imageInput" accept="image/*">
            <img id="preview" class="hidden" alt="Selected leaf preview">
          </div>
          <p id="uploadMessage" class="muted"></p>
          <button class="primary" id="analyzeButton" data-i18n="analyzeBtn"></button>
        </div>
        <div class="panel hidden" id="resultPanel">
          <h2 data-i18n="result"></h2>
          <img id="resultImage" alt="Analyzed leaf">
          <h3 id="resultDisease"></h3>
          <p id="resultConfidence"></p>
          <div id="resultAdvice"></div>
        </div>
        <div class="notice" data-i18n="notice"></div>
      </section>

      <!-- GUIDE -->
      <section class="page" id="guide">
        <h1 data-i18n="gHead"></h1>
        <p class="muted" data-i18n="gIntro"></p>
        <input id="searchInput" type="search">
        <div class="filters">
          <button class="filter active" data-crop="All" data-i18n="all"></button>
          <button class="filter" data-crop="Potato" data-i18n="potato"></button>
          <button class="filter" data-crop="Tomato" data-i18n="tomato"></button>
        </div>
        <div class="grid" id="diseaseList"></div>
        <h2 data-i18n="tHead"></h2>
        <div id="treatmentList"></div>
        <div class="notice" data-i18n="gNotice"></div>
      </section>

      <!-- TIPS -->
      <section class="page" id="tips">
        <h1 data-i18n="tipsHead"></h1>
        <p class="muted" data-i18n="tipsIntro"></p>
        <div class="grid" id="tipsList"></div>
      </section>
    </main>
    <footer data-i18n="footer"></footer>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
